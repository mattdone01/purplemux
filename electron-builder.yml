appId: com.subicura.purplemux
productName: purplemux
directories:
  buildResources: build-resources
  output: release

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build-resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true

publish:
  provider: github
  owner: subicura
  repo: purplemux

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

files:
  - dist-electron/**/*
  - dist/**/*
  - .next/standalone/**/*
  - public/**/*
  - src/config/tmux.conf
  - "!node_modules"
  - "!**/*.map"

asar: true
npmRebuild: true
nativeRebuilder: sequential
asarUnpack:
  - "**/node-pty/**"
  - "**/better-sqlite3/**"
  - "**/*.node"
  - ".next/standalone/**"
  - "src/config/tmux.conf"

afterPack: "./scripts/after-pack.js"

extraMetadata:
  main: dist-electron/main.js
